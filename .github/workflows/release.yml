name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pack the vault
        run: |
          mkdir dist
          cp -r vault dist/adr-agent-template
          mkdir dist/adr-agent-template/3-Discussions
          cd dist
          zip -r "../adr-agent-template-${GITHUB_REF_NAME}.zip" adr-agent-template

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "adr-agent-template-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
